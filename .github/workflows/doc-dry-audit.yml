name: doc-dry-audit

# BP9 DOCUMENTATION-DRY (00-BUILDPRINCIPLE.md), machine-enforced: fail loudly when a concept is stated
# VERBATIM in >= 2 of this repo's governance docs (the Trinity + CLAUDE.md + policy/CLAUDE.md + FLEET.md)
# — a concept living in two homes instead of one, the precondition for the copies silently drifting apart.
# The intra-repo companion to fleet-guard-parity (which enforces the CROSS-repo identical blocks). See
# bin/doc-dry-audit.sh; the accepted-overlap baseline is doc-dry-allow.txt. Offline, no secrets, no
# cross-repo read — a pure local text audit, baselined GREEN so it blocks nothing today and RED only on
# NEW cross-document duplication.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "40 4 * * *"   # daily 04:40 UTC — surfaces drift even with no PR activity (fleet-parity precedent)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doc-dry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the docs + bin/doc-dry-audit.sh)
        uses: actions/checkout@v4
      - name: Cross-document DRY drift-audit
        run: bash bin/doc-dry-audit.sh
