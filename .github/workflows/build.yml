name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Monthly --no-cache rebuild on the 15th at 04:00 UTC. The in-fedora-dev
    # claudebox already refreshes claude-code DAILY from Anthropic's `latest`
    # channel, so the base only needs upstream RPM updates (Fedora, tailscale,
    # distrobox) — monthly is plenty. Host-side image refresh respects an
    # in-fedora-dev session lock so this cron doesn't kill mid-flight work.
    - cron: "0 4 15 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  # ==========================================================================
  # BUILD + PUSH to ghcr.io/oso-gato/fedora-dev.
  # On pull_request: BUILD-ONLY validation (no registry write). On push to main /
  # cron / dispatch: build, push.
  #
  # There is NO CI label-gate. CORRECTED 2026-07-29 (STEP 4 of #274): this used to name
  # `gate-push.sh` as "the sole backstop". That hook was REMOVED FLEET-WIDE on 2026-07-11
  # (the P0 unshackle), and a fleet-guard-parity CHECK now FAILS any repo that still ships
  # it -- so this comment named a backstop that not only does not exist but is actively
  # forbidden. The real controls on `main` are: the server-side `require-PR` ruleset,
  # the `Bash(gh pr merge:*)` deny in managed-settings, and the headless poller's two
  # INDEPENDENT gates (host live-gate + fitness, distinct App identities).
  #
  # `main` IS server-protected: repository ruleset 18222949 enforces `pull_request` (nothing
  # direct-pushes `main`; required approvals = 0 — a human APPROVAL is deliberately NOT required,
  # because the poller's two App gates are the merge safety), plus `non_fast_forward` and
  # `deletion`. There is NO human click anywhere in the merge path — it was removed on 2026-07-11
  # (the P0 unshackle). The previous claim here ("intentionally NOT branch-protected … the click
  # already gates every merge") was false on BOTH counts; it is deleted for the same reason as the
  # `gate-push.sh` claim above. Guardrail changes are kept standalone and flagged in the merge TLDR.
  # ==========================================================================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          # PRs validate the build only — never push a PR image to the registry.
          push: ${{ github.event_name != 'pull_request' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/fedora-dev:latest
            ghcr.io/${{ github.repository_owner }}/fedora-dev:${{ steps.meta.outputs.date }}
            ghcr.io/${{ github.repository_owner }}/fedora-dev:${{ steps.meta.outputs.sha }}
