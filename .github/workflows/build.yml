name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Monthly --no-cache rebuild on the 15th at 04:00 UTC. The in-fedora-dev
    # claudebox already refreshes claude-code DAILY from Anthropic's `latest`
    # channel, so the base only needs upstream RPM updates (Fedora, tailscale,
    # distrobox) — monthly is plenty. Host-side image refresh respects an
    # in-fedora-dev session lock so this cron doesn't kill mid-flight work.
    - cron: "0 4 15 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read
  id-token: write  # OIDC for cosign keyless signing

jobs:
  # ==========================================================================
  # CONTROL-PLANE DIFF-GUARD (the promotion gate's CI backstop).
  #
  # The in-box mechanical gate (the managed PreToolUse hook gate-push.sh +
  # managed-settings allowManagedHooksOnly) blocks the AGENT from pushing/merging
  # main unapproved. This job is the CI-side backstop: it FAILS any PR that touches
  # a guardrail / control-plane file UNLESS the PR carries the `control-plane-approved`
  # label — so a control-plane change cannot land silently; a reviewer must see it
  # isolated and apply the label by hand. (Branch protection on main, requiring a
  # PR + review, is the PRIMARY server-side backstop — this complements it.)
  #
  # Runs only on pull_request. A push to main has already passed review.
  # ==========================================================================
  control-plane-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect control-plane / guardrail changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Guardrail / control-plane file globs: policy, managed-settings, the
          # promotion-gate hook, every Quadlet, CI itself, the key-sync helper,
          # run.sh, and the box-rebuild control machinery.
          PATTERNS='
          ^policy/
          ^.github/workflows/
          (^|/)managed-settings\.json$
          (^|/).*\.container$
          (^|/)run\.sh$
          (^|/)sync-authorized-keys\.sh$
          (^|/)gate-push\.sh$
          (^|/)box-rebuild\.sh$
          (^|/)claudebox-assemble\.sh$
          (^|/).*sudoers.*$
          '
          ERE=$(printf '%s\n' "$PATTERNS" | sed '/^[[:space:]]*$/d' | paste -sd'|' -)
          echo "Using control-plane ERE: $ERE"

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files in this PR:"; echo "$CHANGED"

          HITS=$(printf '%s\n' "$CHANGED" | grep -E "$ERE" || true)
          if [ -n "$HITS" ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            { echo "files<<EOF"; echo "$HITS"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce the waiver label on control-plane changes
        if: steps.detect.outputs.touched == 'true'
        env:
          HAS_WAIVER: ${{ contains(github.event.pull_request.labels.*.name, 'control-plane-approved') }}
        run: |
          set -euo pipefail
          echo "::group::Control-plane / guardrail files touched by this PR"
          cat <<'FILES'
          ${{ steps.detect.outputs.files }}
          FILES
          echo "::endgroup::"

          if [ "$HAS_WAIVER" = "true" ]; then
            echo "Waiver label 'control-plane-approved' present — control-plane change is explicitly approved."
            exit 0
          fi

          echo "::error title=Control-plane change without waiver::This PR edits guardrail / control-plane files (listed above) but does NOT carry the 'control-plane-approved' label."
          cat <<'MSG'

          ────────────────────────────────────────────────────────────────────
          CONTROL-PLANE GUARD FAILED

          This PR touches a guardrail / control-plane file (policy/**,
          managed-settings.json, .github/workflows/**, a *.container Quadlet,
          run.sh, the promotion-gate hook, or the box-rebuild control machinery).

          Such a change MUST be STANDALONE, single-purpose, and explicitly approved
          by the maintainer. To land it: a maintainer reviews the isolated diff and
          applies the 'control-plane-approved' label, then re-runs this check.
          There is no auto-bypass.
          ────────────────────────────────────────────────────────────────────
          MSG
          exit 1

  # ==========================================================================
  # BUILD + COSIGN-SIGN + PUSH to ghcr.io/oso-gato/fedora-dev.
  # On pull_request: BUILD-ONLY validation (no registry write), gated behind the
  # control-plane-guard. On push to main / cron / dispatch: build, push, sign.
  # ==========================================================================
  build:
    needs: control-plane-guard
    if: always() && (needs.control-plane-guard.result == 'success' || needs.control-plane-guard.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Compute tags
        id: meta
        run: |
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          # PRs validate the build only — never push a PR image to the registry.
          push: ${{ github.event_name != 'pull_request' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/fedora-dev:latest
            ghcr.io/${{ github.repository_owner }}/fedora-dev:${{ steps.meta.outputs.date }}
            ghcr.io/${{ github.repository_owner }}/fedora-dev:${{ steps.meta.outputs.sha }}

      # Keyless cosign signing via GitHub Actions OIDC. Signs the IMMUTABLE
      # manifest digest. NOTE: host policy.json does NOT enforce this yet
      # (insecureAcceptAnything for ghcr.io/oso-gato/*) — the signature is an audit
      # trail; sigstoreSigned enforcement is operator-gated (Arthur's one-time item).
      - name: Sign image with cosign
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/fedora-dev
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
