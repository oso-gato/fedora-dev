name: build

on:
  push:
    branches:
      - main
  schedule:
    # Monthly --no-cache rebuild on the 15th at 04:00 UTC. The bi-weekly cadence
    # was too aggressive given the in-fedora-dev claudebox already refreshes
    # claude-code DAILY from Anthropic's `latest` channel. The base only needs
    # to pick up upstream RPM updates (Fedora, tailscale, distrobox) — monthly
    # is plenty. Host-side image refresh respects an in-fedora-dev session lock
    # so this cron doesn't kill mid-flight work (see fedora-bootstrap).
    - cron: "0 4 15 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write  # OIDC for cosign keyless signing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Compute tags
        id: meta
        run: |
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/fedora-dev:latest
            ghcr.io/${{ github.repository_owner }}/fedora-dev:${{ steps.meta.outputs.date }}
            ghcr.io/${{ github.repository_owner }}/fedora-dev:${{ steps.meta.outputs.sha }}

      # Keyless cosign signing via GitHub Actions OIDC.
      # Signs the IMMUTABLE manifest digest (not the mutable tags). The
      # signature attaches to the registry as an OCI artifact next to the
      # image. NOTE: host policy.json does NOT enforce this yet — it is
      # `insecureAcceptAnything` for ghcr.io/oso-gato/* (permissive). The keyless
      # signature is an audit trail; `sigstoreSigned` enforcement is operator-gated
      # (and currently impractical for keyless OIDC cert identities) — see
      # fedora-bootstrap policy/CLAUDE.md "image signature verification".
      - name: Sign image with cosign
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/fedora-dev
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
