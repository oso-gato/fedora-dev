name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Monthly --no-cache rebuild on the 15th at 04:00 UTC. The in-fedora-dev
    # claudebox already refreshes claude-code DAILY from Anthropic's `latest`
    # channel, so the base only needs upstream RPM updates (Fedora, tailscale,
    # distrobox) — monthly is plenty. Host-side image refresh respects an
    # in-fedora-dev session lock so this cron doesn't kill mid-flight work.
    - cron: "0 4 15 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  # ==========================================================================
  # BUILD + PUSH to ghcr.io/oso-gato/fedora-dev.
  # On pull_request: BUILD-ONLY validation (no registry write). On push to main /
  # cron / dispatch: build, push.
  #
  # There is NO CI label-gate: the in-session gate-push.sh click is the sole
  # backstop (it routes every push that could touch `main` and every merge verb to
  # a clickable `ask` only Arthur can answer). `main` is intentionally NOT
  # branch-protected for this single-operator fleet — the click already gates every
  # merge. Guardrail changes are kept standalone and flagged in the merge TLDR.
  # ==========================================================================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          # PRs validate the build only — never push a PR image to the registry.
          push: ${{ github.event_name != 'pull_request' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/fedora-dev:latest
            ghcr.io/${{ github.repository_owner }}/fedora-dev:${{ steps.meta.outputs.date }}
            ghcr.io/${{ github.repository_owner }}/fedora-dev:${{ steps.meta.outputs.sha }}
