name: tests

# STEP 1 of the standing work plan (#274) — THE INSPECTOR.
#
# WHY THIS EXISTS. This repository contains ~7,100 lines of genuinely good tests — pure decision cores,
# mutation-proven cases, real fixtures, several of which caught defects that had already shipped to a
# branch. Before this workflow, CI ran essentially NONE of them as a gate: build.yml builds an image and
# the only other workflows audit prose and check fleet parity. The entire test estate gated nothing, so
# a change could break any pure core in the loop and still merge on two green gates that never ran it.
#
# It is also the precondition for everything else in the plan. The design's load-bearing claim is that
# the agent should iterate WITHOUT a human — do the work, run the check, read the failure, fix, repeat.
# That is only safe when a machine, not the agent's opinion, decides whether the code still works.
# Measured across ~9,900 agent runs: 45-48% of all failures were FALSE CLAIMS OF COMPLETION where
# nothing independent could check; where an independent process could check, that fell to 3%.
#
# NO SILENT TRUNCATION — but capability-honest. Every test file and every --selftest is discovered.
# Nothing is capped or sampled. A test that needs a CONTAINER ENGINE (podman/distrobox) is SKIPPED on a
# runner that has none — and the skip is ANNOUNCED by name, with the reason, in the log AND the step
# summary. Skipping loudly is not the same as dropping coverage quietly: the sin is a gate that reads
# "everything passed" when it means "we did not look".
#
# WHY THIS EXISTS (2026-07-29). The first version of this workflow ran everything unconditionally and
# FAILED 10 runs out of 10 — 43 passed, 3 failed: assemble-stamp, claudebox-reassemble and validate-t2,
# all of which drive `podman`/`distrobox` and cannot work on a GitHub ubuntu runner. Had the check been
# made REQUIRED at that point it would have blocked EVERY pull request and stopped the loop dead. The
# maintainer asked for confirmation before switching it on; that question is the only reason it was
# caught. A required gate that can never go green is not a safety net, it is an outage.
#
# The earlier "probed: 43/43 pass" claim was measured INSIDE the devbox, where podman exists. That was
# a real measurement of the wrong environment — the exact class of error this repo keeps making.
#
# Detection is by CAPABILITY, not by a hardcoded list: a test is container-dependent if it mentions
# podman/distrobox/CONTAINER_HOST. So a NEW container test is skipped automatically on a bare runner and
# RUNS automatically wherever an engine exists — the list cannot rot.
#
# TO MAKE THIS A REQUIRED CHECK (one-time, maintainer): Settings → Branches/Rulesets → require the
# "tests" status check. Until that is done this workflow REPORTS but does not BLOCK — it is an
# accelerator with no teeth. The teeth are one checkbox.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run every *.test.sh
        run: |
          set -uo pipefail
          pass=0; fail=0; skip=0; failed=""; skipped=""
          have_engine=0; command -v podman >/dev/null 2>&1 && have_engine=1
          printf 'container engine available: %s\n' "$have_engine"
          shopt -s nullglob
          for t in *.test.sh bin/*.test.sh; do
            # RUN EVERYTHING, then classify a FAILURE — never pre-skip on a guess. Grepping for
            # 'podman' pre-emptively over-skipped 9 tests when only 3 actually need an engine, dropping
            # coverage that would have passed. A test is only excused if it ACTUALLY failed AND this
            # runner has no engine AND it genuinely drives one. Everything else is a real failure.
            printf '\n\033[1m== %s ==\033[0m\n' "$t"
            if timeout 120 bash "$t"; then
              pass=$((pass+1))
            elif [ "$have_engine" -eq 0 ] && grep -qE 'podman|distrobox|CONTAINER_HOST' "$t"; then
              printf '   ^ SKIPPED: failed, and this runner has no container engine (test drives one)\n'
              skip=$((skip+1)); skipped="$skipped $t"
            else
              fail=$((fail+1)); failed="$failed $t"
            fi
          done
          printf '\n=== test files: %s passed, %s failed, %s skipped ===\n' "$pass" "$fail" "$skip"
          if [ "$skip" -ne 0 ]; then
            printf 'SKIPPED (container engine required — NOT covered by this gate):\n'
            for f in $skipped; do printf '  %s\n' "$f"; done
            { printf '### Skipped — need a container engine, NOT covered here\n'
              for f in $skipped; do printf -- '- `%s`\n' "$f"; done; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$fail" -ne 0 ]; then
            printf 'FAILED:\n'; for f in $failed; do printf '  %s\n' "$f"; done
            exit 1
          fi
          printf '%s test files passed, %s skipped\n' "$pass" "$skip" >> "$GITHUB_STEP_SUMMARY"

      - name: Run every --selftest
        run: |
          set -uo pipefail
          pass=0; fail=0; failed=""
          shopt -s nullglob
          have_engine=0; command -v podman >/dev/null 2>&1 && have_engine=1
          for s in bin/*.sh *.sh; do
            grep -q -- '--selftest' "$s" 2>/dev/null || continue
            printf '\n\033[1m== %s --selftest ==\033[0m\n' "$s"
            if timeout 120 bash "$s" --selftest; then
              pass=$((pass+1))
            elif [ "$have_engine" -eq 0 ] && grep -qE 'podman|distrobox|CONTAINER_HOST' "$s"; then
              printf '   ^ SKIPPED: failed, and this runner has no container engine\n'
            else
              fail=$((fail+1)); failed="$failed $s"
            fi
          done
          printf '\n=== selftests: %s passed, %s failed ===\n' "$pass" "$fail"
          if [ "$fail" -ne 0 ]; then
            printf 'FAILED:\n'; for f in $failed; do printf '  %s\n' "$f"; done
            exit 1
          fi
          printf '%s selftests passed\n' "$pass" >> "$GITHUB_STEP_SUMMARY"

      - name: Every bin/*.sh must parse
        # Cheap and absolute: a syntax error in any shipped script is a defect, and bash -n catches the
        # class that has bitten this repo repeatedly (an escaped backtick inside a ${...} expansion, an
        # apostrophe inside a ${VAR:-default}) where the parse error surfaces ~50 lines from its cause.
        run: |
          set -uo pipefail
          fail=0
          shopt -s nullglob
          for s in bin/*.sh *.sh; do
            bash -n "$s" || { printf 'SYNTAX ERROR: %s\n' "$s"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1
          printf 'all scripts parse\n'
