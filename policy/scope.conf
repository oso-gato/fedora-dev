# policy/scope.conf — R16 OPERATING SCOPE.
#
# >>> DEPRECATED AS THE ENROLLMENT AUTHORITY (R16 amendment, 2026-07-16). <<<
# The maintainer-confirmed AUTHORITY is now the CONFIRMED-OBJECTIVE repo-list — the "Repositories this
# objective operates on" table in 00-OBJECTIVES.md (confirmed ONCE, R1). A per-session scope is the
# session's TRANSCRIPTION of that list into the R27 registry, git-VERIFIED at read time (see
# bin/repo-scope.sh / bin/session-registry.sh). THIS FILE survives ONLY as the TRANSITIONAL CEILING the
# SCOPE_SESSION-unset path (the poller) still reads; it is removed at the STEP-10 poller cutover (a
# recorded follow-up NOTE). Do NOT enroll new work here — enroll it in the objective repo-list.
#
# Historical purpose (#167): the ONE authoritative list of repos the apparatus may act on. A repo not
# listed gets NO action (the 2026-07-13 incident: #165 enrolled an out-of-scope repo and no layer
# stopped it, because no layer HELD a scope).
#
# GRAMMAR: one bare repo name per line (org is fixed: oso-gato). '#' starts a comment; blank
# lines ignored; a line with characters outside [A-Za-z0-9._-] is INVALID and IGNORED (it can
# never widen the scope by accident — fail toward NARROWER, never wider).
#
# CHANGING THIS FILE (R16 rule 2 — the dev-plan R1 discipline, structurally enforced):
#   * ADDING a repo merges ONLY with a maintainer's recorded, NAME-BOUND confirmation on the PR —
#     a comment whose FIRST line is exactly `CONFIRMED <repo> [<repo>…]` and nothing else (prose
#     goes on later lines; a bare CONFIRMED confirms NOTHING), its author role-checked
#     admin|maintain via the permission API. The confirmation covers EXACTLY the repos it names,
#     so a post-confirmation head that swaps or extends the adds re-gates unconfirmed
#     (bin/fitness-review.sh RETURNs an uncovered addition as UNSAFE — a blocker, never a NOTE;
#     App identities hold write and can confirm NOTHING).
#   * REMOVING a repo needs no ceremony — narrowing is always safe.
#
# Scope is PER-OBJECTIVE, not permanent (maintainer's ruling, 2026-07-13): a repo off-limits
# today may be in scope tomorrow — amend by the rule above, never by a script default.
#
# THE APPARATUS IS EXACTLY THE HOST/DEVBOX PAIR (maintainer ruling, 2026-07-20):
fedora-dev
fedora-bootstrap
# fedora-desktop, e2e-alpha and knowledge-desktop are REMOVED (2026-07-20): the autonomous
# development-loop apparatus is limited to the host/devbox pair — "not anything else." Those are
# separate workstreams / test scaffolds that get per-objective TEMPORARY scope ONLY when a specific
# confirmed objective needs them (narrowing needs no ceremony — R16 rule 2; re-adding needs a
# maintainer NAME-BOUND `CONFIRMED <repo>`).
