# policy/scope.conf — the R16 OPERATING SCOPE (#167): the ONE authoritative, maintainer-confirmed
# list of repos this apparatus may act on (sweep, gate, fix, review, merge, file tickets/issues
# against). Read by bin/repo-scope.sh; consulted by EVERY actuator before it acts. A repo not
# listed here gets NO action — one loud log line (the 2026-07-13 incident: #165 enrolled an
# out-of-scope repo and no layer stopped it, because no layer HELD a scope).
#
# GRAMMAR: one bare repo name per line (org is fixed: oso-gato). '#' starts a comment; blank
# lines ignored; a line with characters outside [A-Za-z0-9._-] is INVALID and IGNORED (it can
# never widen the scope by accident — fail toward NARROWER, never wider).
#
# CHANGING THIS FILE (R16 rule 2 — the dev-plan R1 discipline, structurally enforced):
#   * ADDING a repo merges ONLY with a maintainer's recorded confirmation on the PR — a comment
#     whose FIRST line starts with CONFIRMED, its author role-checked admin|maintain via the
#     permission API (bin/fitness-review.sh RETURNs an unconfirmed addition as UNSAFE — a
#     blocker, never a NOTE; App identities hold write and can confirm NOTHING).
#   * REMOVING a repo needs no ceremony — narrowing is always safe.
#
# Scope is PER-OBJECTIVE, not permanent (maintainer's ruling, 2026-07-13): a repo off-limits
# today may be in scope tomorrow — amend by the rule above, never by a script default.
#
# Confirmed set (issue #167, maintainer CONFIRMED):
fedora-dev
fedora-bootstrap
fedora-desktop
e2e-alpha
